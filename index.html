* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
  background: #1a0e1a;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* The player is 306:497 aspect ratio.
   We size it to fill height on portrait phones.
   --pw = player width in vw units */
#wrapper {
  /* fit by height: width = height * (306/497) */
  height: 100vh;
  width: calc(100vh * 306 / 497);
  /* but never wider than screen */
  max-width: 100vw;
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
}

/* We use a CSS variable --s = scale factor relative to 306px baseline
   At 306px wide, --s = 1. We set it via JS for pixel-perfect sizing,
   but also provide a CSS fallback using cqw (container query width) */
#wrapper { container-type: inline-size; }

.player {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  --color-title: #78364F;
  --color-primary: #5a3a4a;
  --color-secondary: #8a6a7a;
  --color-panel-text: #F6CFC8;
}

.player.theme-blue {
  --color-title: #063940;
  --color-primary: #063940;
  --color-secondary: #1a6b6b;
  --color-panel-text: #C8D3F6;
}

/* 1cqw = 1% of container width = wrapper_width / 100
   So X px at 306px base = (X / 306 * 100)cqw */
.layer {
  position: absolute;
  top: calc(-23 / 306 * 100cqw);
  left: calc(-35.95cqw);
  width: calc(171.9cqw);
  height: calc(171.9cqw);
  image-rendering: pixelated;
  pointer-events: none;
  user-select: none;
}

.window-title {
  position: absolute;
  left: calc(24 / 306 * 100cqw);
  top: calc(27 / 306 * 100cqw);
  font-family: 'Rainyhearts', monospace;
  font-size: calc(20 / 306 * 100cqw);
  color: var(--color-title);
  z-index: 50;
  pointer-events: none;
  user-select: none;
}

.drag-region {
  position: absolute;
  top: calc(8 / 306 * 100cqw);
  left: 0; width: 100%;
  height: calc(50 / 306 * 100cqw);
  z-index: 100;
}

.btn {
  position: absolute;
  width: calc(20 / 306 * 100cqw);
  height: calc(21 / 306 * 100cqw);
  z-index: 150;
  cursor: pointer;
  border-radius: calc(4 / 306 * 100cqw);
}

.btn-minimize { left: calc(221 / 306 * 100cqw); top: calc(25 / 306 * 100cqw); }
.btn-window   { left: calc(245 / 306 * 100cqw); top: calc(25 / 306 * 100cqw); width: calc(19 / 306 * 100cqw); }
.btn-exit     { left: calc(268 / 306 * 100cqw); top: calc(25 / 306 * 100cqw); }

.settings-layer {
  transform: scale(0.85);
  transform-origin: calc(310 / 512 * 100%) calc(57 / 512 * 100%);
}

.btn-settings {
  left: calc(195 / 306 * 100cqw);
  top: calc(25 / 306 * 100cqw);
}

.settings-panel {
  position: absolute;
  top: calc(47 / 306 * 100cqw);
  right: calc(5 / 306 * 100cqw);
  z-index: 300;
  pointer-events: auto;
  display: none;
}
.settings-panel.open { display: block; }

.settings-panel-inner {
  background: var(--color-primary);
  border: calc(2 / 306 * 100cqw) solid var(--color-secondary);
  border-radius: calc(4 / 306 * 100cqw);
  padding: calc(6 / 306 * 100cqw);
  width: calc(180 / 306 * 100cqw);
  max-height: calc(320 / 306 * 100cqw);
  overflow-y: auto;
  scrollbar-width: none;
  display: flex;
  flex-direction: column;
  gap: calc(4 / 306 * 100cqw);
}

.settings-label {
  font-family: 'Rainyhearts', monospace;
  font-size: calc(11 / 306 * 100cqw);
  color: var(--color-panel-text);
  white-space: nowrap;
}

.settings-theme-row {
  display: flex; flex-wrap: wrap;
  gap: calc(4 / 306 * 100cqw);
}

.settings-theme-btn {
  font-family: 'Rainyhearts', monospace;
  font-size: calc(10 / 306 * 100cqw);
  background: none;
  border: calc(1 / 306 * 100cqw) solid var(--color-panel-text);
  border-radius: calc(2 / 306 * 100cqw);
  color: var(--color-panel-text);
  padding: calc(3 / 306 * 100cqw) calc(6 / 306 * 100cqw);
  cursor: pointer;
}
.settings-theme-btn.active { background: var(--color-panel-text); color: var(--color-primary); }

.settings-playlist-list {
  display: flex; flex-direction: column;
  gap: calc(2 / 306 * 100cqw);
  max-height: calc(140 / 306 * 100cqw);
  overflow-y: auto; scrollbar-width: none;
}

.settings-playlist-item {
  width: 100%;
  font-family: 'Rainyhearts', monospace;
  font-size: calc(10 / 306 * 100cqw);
  background: rgba(255,255,255,0.05);
  border: none;
  border-radius: calc(2 / 306 * 100cqw);
  color: var(--color-panel-text);
  padding: calc(4 / 306 * 100cqw) calc(6 / 306 * 100cqw);
  cursor: pointer; text-align: left;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.settings-playlist-item:hover { background: rgba(255,255,255,0.15); }
.settings-playlist-item.active { background: var(--color-panel-text); color: var(--color-primary); }

.settings-input {
  font-family: 'Rainyhearts', monospace;
  font-size: calc(10 / 306 * 100cqw);
  background: rgba(0,0,0,0.3);
  border: calc(1 / 306 * 100cqw) solid var(--color-panel-text);
  border-radius: calc(2 / 306 * 100cqw);
  color: var(--color-panel-text);
  padding: calc(3 / 306 * 100cqw) calc(4 / 306 * 100cqw);
  outline: none; width: 100%;
}
.settings-input::placeholder { color: rgba(246,207,200,0.4); }
.settings-error {
  font-family: 'Rainyhearts', monospace;
  font-size: calc(9 / 306 * 100cqw); color: #ff6b6b;
}

.volume-hover-zone {
  position: absolute;
  left: calc(253 / 306 * 100cqw);
  bottom: calc(77 / 306 * 100cqw);
  width: calc(20 / 306 * 100cqw);
  height: calc(18 / 306 * 100cqw);
  z-index: 155;
}
.btn-volume-icon {
  position: absolute; left: 0; bottom: 0;
  width: calc(20 / 306 * 100cqw);
  height: calc(20 / 306 * 100cqw);
  cursor: pointer;
}
.volume-hover-zone.expanded { height: calc(107 / 306 * 100cqw); }
.volume-bar-area {
  position: absolute;
  left: calc(2 / 306 * 100cqw);
  top: calc(5 / 306 * 100cqw);
  width: calc(10 / 306 * 100cqw);
  height: calc(82 / 306 * 100cqw);
  cursor: pointer;
}
.layer.volume-bar-layer { z-index: 150; }

.btn-playmode {
  position: absolute;
  left: calc(29 / 306 * 100cqw);
  top: calc(402 / 306 * 100cqw);
  width: calc(25 / 306 * 100cqw);
  height: calc(20 / 306 * 100cqw);
  z-index: 150; cursor: pointer;
}

.progress-seek {
  position: absolute;
  left: calc(30 / 306 * 100cqw);
  top: calc(446 / 306 * 100cqw);
  width: calc(241 / 306 * 100cqw);
  height: calc(6 / 306 * 100cqw);
  z-index: 150; cursor: pointer;
}

.btn-prev { left: calc(62 / 306 * 100cqw);  top: calc(395 / 306 * 100cqw); width: calc(44 / 306 * 100cqw); height: calc(31 / 306 * 100cqw); }
.btn-play { left: calc(130 / 306 * 100cqw); top: calc(395 / 306 * 100cqw); width: calc(44 / 306 * 100cqw); height: calc(31 / 306 * 100cqw); }
.btn-next { left: calc(200 / 306 * 100cqw); top: calc(395 / 306 * 100cqw); width: calc(44 / 306 * 100cqw); height: calc(31 / 306 * 100cqw); }

.now-playing {
  position: absolute;
  left: calc(85 / 306 * 100cqw);
  top: calc(332 / 306 * 100cqw);
  display: flex; flex-direction: column;
  z-index: 50; pointer-events: none;
}

.record-player {
  position: absolute;
  width: calc(200 / 306 * 100cqw);
  left: 50%;
  top: calc(120 / 306 * 100cqw);
  transform: translateX(-50%);
  image-rendering: pixelated;
  pointer-events: none; user-select: none;
  z-index: 10;
}

.frame-overlay { z-index: 15; }
.layer-ui { z-index: 20; }

.record-slide-out { animation: slide-out 0.6s ease-in forwards; }
.record-slide-in  { animation: slide-in  0.6s ease-out forwards; }

@keyframes slide-out {
  0%   { transform: translate(-50%, 0); }
  100% { transform: translate(calc(-50% - 60cqw), 20cqw); }
}
@keyframes slide-in {
  0%   { transform: translate(calc(-50% - 60cqw), 20cqw); }
  100% { transform: translate(-50%, 0); }
}

.album-frame-layer {
  left: calc(-36.28cqw);
  top: calc(-23 / 306 * 100cqw);
  z-index: 45;
}

.album-mask {
  position: absolute;
  left: calc(36 / 306 * 100cqw);
  top: calc(333 / 306 * 100cqw);
  width: calc(42 / 306 * 100cqw);
  height: calc(42 / 306 * 100cqw);
  clip-path: url(#album-mask);
  overflow: hidden; z-index: 40; pointer-events: none;
}
.album-art { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }

.track-info { display: flex; flex-direction: column; }
.now-playing-label {
  font-family: 'Rainyhearts', monospace;
  font-size: calc(12 / 306 * 100cqw);
  color: var(--color-secondary);
}
.marquee-container {
  font-family: 'Rainyhearts', monospace;
  font-size: calc(24 / 306 * 100cqw);
  color: var(--color-primary);
  white-space: nowrap; overflow: hidden;
  max-width: calc(170 / 306 * 100cqw);
}
.marquee-measure {
  position: absolute; visibility: hidden; pointer-events: none; white-space: nowrap;
  font-family: 'Rainyhearts', monospace;
  font-size: calc(24 / 306 * 100cqw);
}
.marquee-scroll { display: inline-block; animation: marquee 8s linear infinite; }
.marquee-gap { margin-left: calc(28 / 306 * 100cqw); }
@keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

.track-artist {
  font-family: 'Rainyhearts', monospace;
  font-size: calc(14 / 306 * 100cqw);
  color: var(--color-secondary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: calc(200 / 306 * 100cqw);
}

.time-display {
  position: absolute;
  left: calc(26 / 306 * 100cqw);
  top: calc(456 / 306 * 100cqw);
  width: calc(246 / 306 * 100cqw);
  display: flex; justify-content: space-between;
  z-index: 50; pointer-events: none;
  font-family: 'Rainyhearts', monospace;
  font-size: calc(12 / 306 * 100cqw);
  color: var(--color-primary);
}
</style>
</head>

<div id="wrapper"><div class="player" id="player">
  <img id="frame-img" class="layer" alt="" draggable="false">
  <div class="window-title">Sheldon's player</div>
  <img id="record-player-img" class="record-player" alt="" draggable="false">
  <img id="record-current" class="record-player" alt="" draggable="false">
  <img id="record-incoming" class="record-player record-slide-in" alt="" draggable="false" style="display:none">
  <img id="needle-img" class="record-player" alt="" draggable="false">
  <img id="frame-nobg-img" class="layer frame-overlay" alt="" draggable="false">
  <img id="plant-img" class="layer layer-ui" alt="" draggable="false">
  <img id="progressbar-img" class="layer layer-ui" alt="" draggable="false">
  <img id="progressbar-stars-img" class="layer layer-ui" alt="" draggable="false" style="clip-path: inset(0 100% 0 0);">
  <img id="star-img" class="layer layer-ui" alt="" draggable="false" style="transform: translateX(calc(-3 / 306 * calc(100 / 100 * var(--u)) + calc(0 / 100 * var(--u))));">
  <img id="backwards-img" class="layer layer-ui" alt="" draggable="false">
  <img id="play-pause-img" class="layer layer-ui" alt="" draggable="false">
  <img id="forwards-img" class="layer layer-ui" alt="" draggable="false">
  <img id="volume-icon-img" class="layer layer-ui" alt="" draggable="false" style="opacity:0.8">
  <img id="playmode-img" class="layer layer-ui" alt="" draggable="false" style="opacity:0.4">
  <img id="minimizer-img" class="layer layer-ui" alt="" draggable="false">
  <img id="window-img" class="layer layer-ui" alt="" draggable="false">
  <img id="exit-img" class="layer layer-ui" alt="" draggable="false">
  <img id="settings-icon-img" class="layer layer-ui settings-layer" alt="" draggable="false">
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <clipPath id="album-mask" clipPathUnits="objectBoundingBox">
        <rect x="0.07317" y="0" width="0.85366" height="1"/>
        <rect x="0.04878" y="0.02439" width="0.90244" height="0.95122"/>
        <rect x="0.02439" y="0.04878" width="0.95122" height="0.90244"/>
        <rect x="0" y="0.07317" width="1" height="0.85366"/>
      </clipPath>
    </defs>
  </svg>
  <div class="album-mask" id="album-mask-div">
    <img id="album-art-img" class="album-art" alt="" draggable="false">
  </div>
  <img id="album-frame-img" class="layer album-frame-layer" alt="" draggable="false">
  <div class="now-playing">
    <div class="track-info">
      <div class="now-playing-label">now playing...</div>
      <div class="marquee-container" id="track-title-container">
        <span id="marquee-measure" class="marquee-measure"></span>
        <span id="track-title-span"></span>
      </div>
      <div class="track-artist" id="track-artist"></div>
    </div>
  </div>
  <div class="time-display">
    <span id="time-current">0:00</span>
    <span id="time-remaining">0:00</span>
  </div>
  <div class="drag-region"></div>
  <div class="progress-seek" id="progress-seek"></div>
  <div class="btn btn-prev" id="btn-prev"></div>
  <div class="btn btn-play" id="btn-play"></div>
  <div class="btn btn-next" id="btn-next"></div>
  <div class="volume-hover-zone" id="volume-hover-zone">
    <div class="btn-volume-icon" id="btn-volume"></div>
    <img id="vol-bar-low" class="layer layer-ui volume-bar-layer" alt="" draggable="false" style="display:none">
    <img id="vol-bar-high" class="layer layer-ui volume-bar-layer" alt="" draggable="false" style="display:none; clip-path: inset(0% 0 0 0);">
    <div class="volume-bar-area" id="volume-bar-area" style="display:none"></div>
  </div>
  <div class="btn btn-playmode" id="btn-playmode" title="normal"></div>
  <div class="btn btn-settings" id="btn-settings"></div>
  <div class="settings-panel" id="settings-panel">
    <div class="settings-panel-inner">
      <div class="settings-label">theme</div>
      <div class="settings-theme-row">
        <button class="settings-theme-btn active" id="btn-theme-pink" onclick="setTheme('pink')">pink</button>
        <button class="settings-theme-btn" id="btn-theme-blue" onclick="setTheme('blue')">blue</button>
      </div>
      <div class="settings-label">playlist</div>
      <div class="settings-playlist-list" id="playlist-list"></div>
      <div class="settings-label" style="margin-top: calc(4/306*calc(100 / 100 * var(--u)))">add song (catbox/url)</div>
      <input class="settings-input" id="new-title-input" type="text" placeholder="title">
      <input class="settings-input" id="new-artist-input" type="text" placeholder="artist">
      <input class="settings-input" id="new-url-input" type="text" placeholder="direct audio url (catbox etc)">
      <input class="settings-input" id="new-art-input" type="text" placeholder="album art url (optional)">
      <button class="settings-theme-btn" onclick="addSong()">add song</button>
      <button class="settings-theme-btn" onclick="removeSong()" style="margin-top:2px">remove current song</button>
      <div id="settings-error" class="settings-error" style="display:none"></div>
    </div>
  </div>
</div>

</div><audio id="audio"></audio>
